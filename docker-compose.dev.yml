version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: fastapi-app-gemini-gateway
    volumes:
      - ./app:/app/app
      - ./config:/app/config
      - ./data:/app/data
    expose:
      - "8000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1

  nginx:
    build:
      context: ./nginx
    container_name: nginx-proxy-gemini-gateway
    ports:
      - "80:80"
    depends_on:
      - app
    restart: unless-stopped
